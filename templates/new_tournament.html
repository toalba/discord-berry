<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neues Tournament erstellen</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { margin-bottom: 30px; color: #fff; }
        .card {
            background: #252525;
            border-radius: 8px;
            padding: 30px;
            border: 1px solid #333;
        }
        label {
            display: block;
            margin: 15px 0 5px;
            font-weight: bold;
            color: #bbb;
        }
        input {
            background: #333;
            border: 1px solid #555;
            color: #e0e0e0;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 14px;
            width: 100%;
        }
        input:focus {
            outline: none;
            border-color: #4a9eff;
        }
        .btn {
            background: #4a9eff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            margin-top: 20px;
            width: 100%;
        }
        .btn:hover { background: #357ab8; }
        .back-link {
            color: #4a9eff;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
        }
        .back-link:hover { text-decoration: underline; }
        .hint { color: #888; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Zurück zur Übersicht</a>
        
        <h1>Neues Tournament erstellen</h1>
        
        <div class="card">
            <form method="POST">
                <label for="id">Tournament ID</label>
                <input type="text" id="id" name="id" required pattern="[a-z0-9_-]+" 
                       placeholder="z.B. spring_2026">
                <p class="hint">Nur Kleinbuchstaben, Zahlen, Unterstriche und Bindestriche erlaubt</p>

                <label for="name">Tournament Name</label>
                <input type="text" id="name" name="name" required 
                       placeholder="z.B. Spring Championship 2026">

                <button type="submit" class="btn">Tournament erstellen</button>
            </form>
        </div>
    </div>
</body>
</html>
